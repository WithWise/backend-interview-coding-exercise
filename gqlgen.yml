schema:
  - graph/*.graphqls

exec:
  filename: graph/generated.go
  package: graph

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

autobind:
  - "github.com/wise/backend-interview-kit/internal/model"

models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
  JobStatus:
    model:
      - github.com/wise/backend-interview-kit/internal/model.JobStatus
  Job:
    model:
      - github.com/wise/backend-interview-kit/internal/model.Job
  Driver:
    model:
      - github.com/wise/backend-interview-kit/internal/model.Driver
  Depot:
    model:
      - github.com/wise/backend-interview-kit/internal/model.Depot
